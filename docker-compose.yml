version: '3.8'

services:
  # PostgreSQL veritabanı
  postgres:
    image: ankane/pgvector:latest
    container_name: ai_content_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asdasd
      POSTGRES_DB: ai_platform_db
    ports:
      - "5435:5432" # Dışarıyı 5435 yaptık (Çakışma bitti)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: ai_content_redis
    ports:
      - "6380:6379" # Dışarıyı 6380 yaptık
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: ai_content_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      # DİKKAT: Host olarak 'postgres' (servis adı) kullanıldı
      - DATABASE_URL=postgresql://postgres:asdasd@postgres:5432/ai_platform_db
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - JWT_SECRET=
      - OPENAI_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend Next.js
  frontend:
    build: ./frontend
    container_name: ai_content_frontend
    ports:
      - "3010:3000" # Dışarıyı 3010 yaptık
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data: