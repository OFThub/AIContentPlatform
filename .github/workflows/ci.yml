name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector >= 0.5.0 is required: the schema builds an HNSW index.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicontent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aicontent"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aicontent
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Load schema and migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/init.sql
          cd backend && npm run migrate

      - name: Seed demo data
        run: npm run seed
        working-directory: backend

      - run: npm run lint
        working-directory: backend

      - run: npm test
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Proves the one-command quickstart in the README still builds.
      - run: docker compose build
